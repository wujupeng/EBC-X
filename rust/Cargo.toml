[workspace]
resolver = "2"
members = [
    "crates/evidence-hash",
    "crates/crypto",
    "crates/schema-validator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"