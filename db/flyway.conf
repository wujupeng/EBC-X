# EBC-X Flyway Configuration
# Design ref: design.md D15 Data Architecture

flyway.url=jdbc:postgresql://localhost:5432/ebcx
flyway.user=ebcx_migration
flyway.password=${EBCX_DB_MIGRATION_PASSWORD}
flyway.schemas=business,evidence,outbox,audit,master_data,policy,tenant
flyway.locations=filesystem:db/migrations
